name: reproduce

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # build_all.py uses the standard library only, so no packages are installed.
      - name: Rebuild every number and compare with the committed files
        run: python3 -I scripts/build_all.py
